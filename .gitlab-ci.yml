# Pipeline CI/CD Web UI Automation (SauceDemo) - Team 2
image: maven:3.9.6-eclipse-temurin-17

stages:
  - test
  - report

variables:
  MAVEN_OPTS: "-Dhttps.protocols=TLSv1.2 -Dmaven.repo.local=.m2/repository"

cache:
  paths:
    - .m2/repository/

run_ui_tests:
  stage: test
  before_script:
    - apt-get update && apt-get install -y wget gnupg
    - wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | apt-key add -
    - echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list
    - apt-get update && apt-get install -y google-chrome-stable
  script:
    - mvn clean test -Dheadless=true
  artifacts:
    when: always
    paths:
      - target/surefire-reports
      - target/allure-results
    reports:
      junit:
        - target/surefire-reports/junitreports/TEST-*.xml
    expire_in: 1 week

pages:
  stage: report
  needs: ["run_ui_tests"]
  script:
    - mvn allure:report
    - mkdir -p public
    - cp -r target/site/allure-maven-plugin/* public/
  artifacts:
    paths:
      - public
    expire_in: 30 days
  only:
    - main
    - develop
